<div class="search-bar">
  <input 
    type="text" 
    placeholder="Buscar..." 
    [(ngModel)]="query"
    (input)="onSearch()"
  />
  <div class="filters">
    <button (click)="onFilterChange('all')" [class.active]="filter === 'all'">Todo</button>
    <button (click)="onFilterChange('images')" [class.active]="filter === 'images'">Imágenes</button>
    <button (click)="onFilterChange('music')" [class.active]="filter === 'music'">Videos</button>
  </div>
</div>
